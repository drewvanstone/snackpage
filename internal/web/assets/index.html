<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snackpage</title>
  <script src="/static/theme-registry.js{{if .Version}}?v={{.Version}}{{end}}"></script>
  <script src="/static/theme-bootstrap.js{{if .Version}}?v={{.Version}}{{end}}" data-version="{{.Version}}"></script>
  <link rel="stylesheet" href="/static/style.css{{if .Version}}?v={{.Version}}{{end}}">
</head>
<body>
  <main class="picker" id="picker" data-mode="insert">
    <div class="picker-title">snackpage</div>
    <div class="prompt">
      <span class="glyph">❯</span>
      <label class="sr-only" for="q">Search bookmarks</label>
      <input id="q" type="text" role="combobox" aria-autocomplete="list" aria-controls="list" aria-expanded="false" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    </div>
    <ul id="list" class="list" role="listbox" aria-label="Bookmark search results"></ul>
    <div class="footer">
      <span id="count"></span>
      <span id="hints" class="hints">↑↓ select · ⏎ open · ⎋ normal mode</span>
      <span class="footer-meta">
        <a href="/manage" class="cross-link">manage</a>
        {{if .Version}}<span class="app-version">version {{.Version}}</span>{{end}}
      </span>
    </div>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  </main>

  <div id="modal-root"></div>

  <script src="/static/vendor/fzf.umd.min.js{{if .Version}}?v={{.Version}}{{end}}"></script>
  <script type="module" src="/static/app.js{{if .Version}}?v={{.Version}}{{end}}"></script>
</body>
</html>
