name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          check-latest: true
          cache: false
      - run: go test ./... -race -cover

  quality:
    name: Format, lint, and HTTP E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          check-latest: true
          cache: false
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make format-check
      - run: make lint
      - run: make e2e

  browser:
    name: Browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          check-latest: true
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: tests/frontend
        run: npm ci
      - name: Install Playwright browsers and system dependencies
        working-directory: tests/frontend
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: make test-frontend
      - run: make test-frontend-smoke
